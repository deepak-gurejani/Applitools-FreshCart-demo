name: Eyes Visual Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  visual-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Set Applitools branch name
        run: echo "APPLITOOLS_BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" >> $GITHUB_ENV

      - name: Run Eyes visual tests
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          APPLITOOLS_BRANCH: ${{ env.APPLITOOLS_BRANCH }}
          APPLITOOLS_PARENT_BRANCH: main
        run: mvn -B test

      - name: Print Eyes batch URL
        if: always()
        run: echo "Check results at https://eyes.applitools.com"
